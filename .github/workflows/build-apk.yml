name: Build Signal APK (Ultimate)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: سحب الكود
      uses: actions/checkout@v7.0.1
      with:
        submodules: true
        lfs: true
        fetch-depth: 1

    - name: إعداد JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: التحقق من Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: إعداد Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ !startsWith(github.ref, 'refs/heads/8.') }}
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-provider: basic

    # ✅ إنشاء ملف gradle.properties مؤقت بإعدادات ذاكرة منخفضة جداً
    - name: إعداد ذاكرة منخفضة
      run: |
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2g -Xms128m -XX:MaxMetaspaceSize=256m
        kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=128m
        org.gradle.parallel=false
        org.gradle.caching=true
        org.gradle.daemon=false
        android.useAndroidX=true
        android.experimental.enableScreenshotTest=true
        android.experimental.enableTestFixturesKotlinSupport=true
        android.disallowKotlinSourceSets=false
        EOF

    # ✅ بناء فقط المهام الأساسية
    - name: بناء APK (تسلسلي بالكامل)
      env:
        SIGNAL_BUILD_CACHE_URL: ${{ secrets.SIGNAL_BUILD_CACHE_URL }}
        SIGNAL_BUILD_CACHE_USER: ${{ secrets.SIGNAL_BUILD_CACHE_USER }}
        SIGNAL_BUILD_CACHE_PASSWORD: ${{ secrets.SIGNAL_BUILD_CACHE_PASSWORD }}
        SIGNAL_BUILD_CACHE_PUSH: ${{ startsWith(github.ref, 'refs/heads/8.') }}
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
          ./gradlew :app:assemblePlayProdRelease \
            --no-daemon \
            --max-workers=1 \
            --no-parallel \
            --build-cache \
            -Dkotlin.daemon.jvmargs="-Xmx1g" \
            -x lint \
            -x test \
            -x lintVital \
            -x verifyReleaseResources \
            -x compileReleaseArtProfile \
            -x generateReleaseBaselineProfile
        else
          ./gradlew :app:assemblePlayProdDebug \
            --no-daemon \
            --max-workers=1 \
            --no-parallel \
            --build-cache \
            -Dkotlin.daemon.jvmargs="-Xmx1g" \
            -x lint \
            -x test \
            -x compileDebugArtProfile \
            -x generateDebugBaselineProfile
        fi

    - name: رفع APK
      uses: actions/upload-artifact@v7
      with:
        name: signal-${{ github.event.inputs.build_type || 'debug' }}-apk
        path: app/build/outputs/apk/playProd/${{ github.event.inputs.build_type || 'debug' }}/*.apk
        if-no-files-found: error

    - name: رفع التقارير
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: reports
        path: |
          **/build/reports
          **/build/test-results
        if-no-files-found: ignore
