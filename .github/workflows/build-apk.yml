name: Build Signal APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  pull_request:
  push:
    branches:
    - 'main'
    - '8.**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: سحب الكود مع تحسينات السرعة
      uses: actions/checkout@v7.0.1
      with:
        submodules: true
        lfs: true
        fetch-depth: 1

    - name: إعداد JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: التحقق من Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: إعداد Gradle مع كاش محسّن
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ !startsWith(github.ref, 'refs/heads/8.') }}
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        gradle-home-cache-includes: |
          caches
          notifications
          jdks
          wrapper

    - name: تحميل التبعيات مسبقاً
      run: ./gradlew dependencies --no-daemon

    - name: بناء APK مع تحسينات السرعة
      env:
        SIGNAL_BUILD_CACHE_URL: ${{ secrets.SIGNAL_BUILD_CACHE_URL }}
        SIGNAL_BUILD_CACHE_USER: ${{ secrets.SIGNAL_BUILD_CACHE_USER }}
        SIGNAL_BUILD_CACHE_PASSWORD: ${{ secrets.SIGNAL_BUILD_CACHE_PASSWORD }}
        SIGNAL_BUILD_CACHE_PUSH: ${{ startsWith(github.ref, 'refs/heads/8.') }}
        GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.workers.max=4"
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
          ./gradlew assembleRelease --no-daemon --parallel --max-workers=4
        else
          ./gradlew assembleDebug --no-daemon --parallel --max-workers=4
        fi

    - name: رفع ملف APK
      uses: actions/upload-artifact@v7
      with:
        name: signal-${{ github.event.inputs.build_type || 'debug' }}-apk
        path: app/build/outputs/apk/${{ github.event.inputs.build_type || 'debug' }}/*.apk
        if-no-files-found: error

    - name: أرشفة التقارير في حالة الفشل
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: reports
        path: |
          **/build/reports
          **/build/test-results
        if-no-files-found: ignore
