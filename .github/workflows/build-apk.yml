name: Build Signal APK (Ultra Fast)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    # ⚡ إلغاء أي بناء سابق إذا بدأ بناء جديد
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
    # ⚡ خطوة 1: سحب سريع للكود (آخر commit فقط)
    - name: سحب الكود بسرعة
      uses: actions/checkout@v7.0.1
      with:
        submodules: true
        lfs: true
        fetch-depth: 1  # ⚡ يجلب آخر commit بس

    # ⚡ خطوة 2: إعداد Java بسرعة
    - name: إعداد JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    # ⚡ خطوة 3: التحقق من Gradle Wrapper
    - name: التحقق من Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6

    # ⚡ خطوة 4: إعداد Gradle مع كاش أساسي (لتوفير الذاكرة)
    - name: إعداد Gradle مع كاش أساسي
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ !startsWith(github.ref, 'refs/heads/8.') }}
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-provider: basic  # ✅ استخدام الكاش الأساسي بدل المحسن لتوفير الذاكرة
        gradle-home-cache-includes: |
          caches
          notifications
          jdks
          wrapper

    # ⚡ خطوة 5: تحميل التبعيات بشكل منفصل لتسريع البناء
    - name: تحميل التبعيات
      run: |
        ./gradlew dependencies --no-daemon --parallel

    # ⚡ خطوة 6: إعداد متغيرات الذاكرة المحسنة
    - name: إعداد متغيرات الأداء
      run: |
        echo "GRADLE_OPTS=-Xmx4g -XX:MaxMetaspaceSize=512m -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false" >> $GITHUB_ENV
        echo "JAVA_OPTS=-Xmx4g -XX:+UseG1GC -XX:+OptimizeStringConcat -XX:+UseStringDeduplication" >> $GITHUB_ENV
        echo "KOTLIN_DAEMON_JVM_ARGS=-Xmx2g -XX:MaxMetaspaceSize=256m" >> $GITHUB_ENV

    # ⚡ خطوة 7: بناء APK بسرعة فائقة مع تحديد ذاكرة Kotlin مباشرة
    - name: بناء APK بسرعة
      env:
        SIGNAL_BUILD_CACHE_URL: ${{ secrets.SIGNAL_BUILD_CACHE_URL }}
        SIGNAL_BUILD_CACHE_USER: ${{ secrets.SIGNAL_BUILD_CACHE_USER }}
        SIGNAL_BUILD_CACHE_PASSWORD: ${{ secrets.SIGNAL_BUILD_CACHE_PASSWORD }}
        SIGNAL_BUILD_CACHE_PUSH: ${{ startsWith(github.ref, 'refs/heads/8.') }}
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
          ./gradlew assembleRelease \
            --no-daemon \
            --parallel \
            --max-workers=2 \
            --build-cache \
            --configure-on-demand \
            -Dkotlin.daemon.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=256m"
        else
          ./gradlew assembleDebug \
            --no-daemon \
            --parallel \
            --max-workers=2 \
            --build-cache \
            --configure-on-demand \
            -Dkotlin.daemon.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=256m"
        fi

    # ⚡ خطوة 8: رفع APK
    - name: رفع APK
      uses: actions/upload-artifact@v7
      with:
        name: signal-${{ github.event.inputs.build_type || 'debug' }}-apk
        path: app/build/outputs/apk/${{ github.event.inputs.build_type || 'debug' }}/*.apk
        if-no-files-found: error

    # ⚡ خطوة 9: رفع التقارير في حالة الفشل (سريع)
    - name: رفع التقارير في حالة الفشل
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: reports
        path: |
          **/build/reports
          **/build/test-results
        if-no-files-found: ignore
